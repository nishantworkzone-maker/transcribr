<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme-vars.css"/>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Transcribr</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif; min-height: 100vh;
  display: flex; flex-direction: column;
  transition: background-color 0.25s, color 0.25s;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 { font-family: 'Syne', sans-serif; }
a { color: inherit; text-decoration: none; }

/* NAV */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--nav-bg); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--text); }
.logo-dot { color: var(--accent2); }
.nav-back { font-size: 0.82rem; color: var(--muted); transition: color 0.2s; }
.nav-back:hover { color: var(--text); }

/* AUTH WRAP */
.auth-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 2rem; position: relative; overflow: hidden;
}
/* Subtle glow behind card */
.auth-wrap::before {
  content: '';
  position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px; pointer-events: none;
  background: radial-gradient(ellipse, rgba(108,92,231,0.08) 0%, transparent 70%);
}

/* AUTH CARD */
.auth-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 20px; padding: 2.25rem;
  width: 100%; max-width: 420px; position: relative; z-index: 1;
  box-shadow: 0 8px 40px var(--shadow-lg);
  transition: background-color 0.25s, border-color 0.25s;
}

.auth-logo-wrap {
  text-align: center; margin-bottom: 1.5rem;
}
.auth-logo {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.6rem; color: var(--text);
}
.auth-logo span { color: var(--accent2); }

.auth-title { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 0.35rem; }
.auth-sub { color: var(--muted); font-size: 0.86rem; text-align: center; margin-bottom: 1.75rem; line-height: 1.6; }

/* TABS */
.tabs {
  display: flex; background: var(--surface2); border-radius: 10px;
  padding: 3px; margin-bottom: 1.6rem; gap: 2px;
}
.tab {
  flex: 1; padding: 0.5rem; text-align: center; border-radius: 8px;
  cursor: pointer; font-size: 0.86rem; color: var(--muted);
  transition: all 0.2s; border: none; background: transparent;
  font-family: 'DM Sans', sans-serif; font-weight: 500;
}
.tab.active { background: var(--accent); color: #fff; }

/* GOOGLE BTN */
.google-btn {
  width: 100%; padding: 0.72rem;
  background: var(--surface3); color: var(--text);
  border: 1px solid var(--border2); border-radius: 10px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: 'DM Sans', sans-serif;
  transition: background 0.2s, border-color 0.2s;
  margin-bottom: 1.2rem;
}
.google-btn:hover {
  background: var(--surface2); border-color: var(--accent2);
}
[data-theme="light"] .google-btn {
  background: #fff; color: #1a1a1a; border-color: rgba(0,0,0,0.14);
}
[data-theme="light"] .google-btn:hover { background: #f5f5f5; }
.google-icon { width: 18px; height: 18px; flex-shrink: 0; }

/* DIVIDER */
.divider {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.2rem; color: var(--muted); font-size: 0.78rem;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border2);
}

/* FORM */
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.form-group input {
  width: 100%; background: var(--input-bg, var(--surface2));
  border: 1px solid var(--input-border, var(--border2)); color: var(--text);
  border-radius: 10px; padding: 0.7rem 0.9rem;
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  transition: border-color 0.2s, background 0.25s; outline: none;
}
.form-group input::placeholder { color: var(--muted); }
.form-group input:focus { border-color: var(--accent); }

.submit-btn {
  width: 100%; padding: 0.78rem;
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; font-size: 0.9rem; font-weight: 600;
  cursor: pointer; font-family: 'Syne', sans-serif;
  transition: opacity 0.2s; margin-top: 0.35rem;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.submit-btn:hover { opacity: 0.88; }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* MESSAGES */
.error-msg {
  background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
  color: var(--red, #f87171); padding: 0.6rem 0.9rem; border-radius: 8px;
  font-size: 0.83rem; margin-bottom: 1rem; display: none; line-height: 1.55;
}
.success-msg {
  background: rgba(0,212,170,0.1); border: 1px solid rgba(0,212,170,0.3);
  color: var(--green); padding: 0.6rem 0.9rem; border-radius: 8px;
  font-size: 0.83rem; margin-bottom: 1rem; display: none; line-height: 1.55;
}

/* SWITCH TEXT */
.switch-text { text-align: center; font-size: 0.84rem; color: var(--muted); margin-top: 1.2rem; }
.switch-text a { color: var(--accent2); cursor: pointer; font-weight: 500; }
.switch-text a:hover { text-decoration: underline; }

.back-link { text-align: center; margin-top: 1rem; }
.back-link a { color: var(--muted); font-size: 0.8rem; }
.back-link a:hover { color: var(--text); }

/* FOOTER BENEFITS */
.auth-benefits {
  display: flex; justify-content: center; gap: 1.5rem;
  flex-wrap: wrap; margin-top: 1.75rem;
}
.benefit-item { display: flex; align-items: center; gap: 5px; font-size: 0.74rem; color: var(--muted); }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">Transcribr<span class="logo-dot">.</span></a>
  <a href="/" class="nav-back">← Back to home</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo-wrap">
      <div class="auth-logo">Transcribr<span>.</span></div>
    </div>

    <h2 class="auth-title" id="authTitle">Welcome back</h2>
    <p class="auth-sub" id="authSub">Sign in to access your transcripts and history</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Google -->
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or continue with email</div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')signIn()"/>
      </div>
      <button class="submit-btn" id="loginBtn" onclick="signIn()">Sign In →</button>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your name" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 8 characters" autocomplete="new-password"
          onkeydown="if(event.key==='Enter')signUp()"/>
      </div>
      <button class="submit-btn" id="signupBtn" onclick="signUp()">Create Free Account →</button>
    </div>

    <div class="switch-text" id="switchText">
      Don't have an account? <a onclick="switchTab('signup')">Sign up free</a>
    </div>

    <div class="back-link">
      <a href="/dashboard.html">← Try as guest instead</a>
    </div>

    <div class="auth-benefits">
      <div class="benefit-item">🔒 No credit card</div>
      <div class="benefit-item">⚡ Free transcriptions</div>
      <div class="benefit-item">📁 Cloud history</div>
    </div>

  </div>
</div>

<script>
let sb;

async function initSupabase() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    if (cfg.error) throw new Error(cfg.error);
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);

    // Check if already logged in
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      redirectAfterLogin();
      return;
    }

    // Handle OAuth callback
    sb.auth.onAuthStateChange((event, session) => {
      if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
        redirectAfterLogin();
      }
    });
  } catch (e) {
    console.error('[initSupabase]', e.message);
    showError('Could not connect to server. Please try again.');
  }
}

function redirectAfterLogin() {
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get('redirect');
  const upgradeIntent = localStorage.getItem('upgrade_intent');
  if (redirect) window.location.href = redirect;
  else if (upgradeIntent) {
    localStorage.removeItem('upgrade_intent');
    window.location.href = '/pricing.html';
  } else {
    window.location.href = '/dashboard.html';
  }
}

function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab');
  tabs[0].classList.toggle('active', tab === 'login');
  tabs[1].classList.toggle('active', tab === 'signup');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('authTitle').textContent = tab === 'login' ? 'Welcome back' : 'Create your account';
  document.getElementById('authSub').textContent = tab === 'login'
    ? 'Sign in to access your transcripts and history'
    : 'Start transcribing for free — no credit card needed';
  document.getElementById('switchText').innerHTML = tab === 'login'
    ? `Don't have an account? <a onclick="switchTab('signup')">Sign up free</a>`
    : `Already have an account? <a onclick="switchTab('login')">Sign in</a>`;
  clearMessages();
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}
function clearMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}

async function signInWithGoogle() {
  if (!sb) return showError('Not connected. Please refresh.');
  clearMessages();
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin +
        (new URLSearchParams(window.location.search).get('redirect') || '/dashboard.html')
    }
  });
  if (error) showError(error.message);
}

async function signIn() {
  if (!sb) return showError('Not connected. Please refresh.');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showError('Please fill in all fields.'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  clearMessages();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showError(error.message === 'Invalid login credentials'
      ? 'Incorrect email or password. Please try again.'
      : error.message);
    btn.disabled = false; btn.textContent = 'Sign In →';
  } else {
    redirectAfterLogin();
  }
}

async function signUp() {
  if (!sb) return showError('Not connected. Please refresh.');
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  if (!name || !email || !password) { showError('Please fill in all fields.'); return; }
  if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account…';
  clearMessages();
  const { error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: name } }
  });
  if (error) {
    showError(error.message);
    btn.disabled = false; btn.textContent = 'Create Free Account →';
  } else {
    showSuccess('🎉 Account created! Check your email to verify, then sign in.');
    btn.disabled = false; btn.textContent = 'Create Free Account →';
  }
}

initSupabase();
</script>
</body>
</html>
